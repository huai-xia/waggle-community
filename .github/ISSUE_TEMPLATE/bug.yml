name: Bug
description: 功能异常、报错、显示不对
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么，看到了什么，期望是什么
      placeholder: |
        1. …
        2. …
        期望：…
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: 在哪里（可选）
      description: 页面路径、浏览器、手机/桌面；可附截图
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 其他
      description: 不要贴简历、密码、隐私信息
    validations:
      required: false
